# VEngine triggers: play an effect when something happens in the game.
#
# Every top-level key is a trigger id. Nothing here is active by default:
# uncomment an example or write your own, then run /ve reload.
#
# event:       hit | death | join | teleport | item_use
# effect:      any effect from /ve list
# skill:       MythicMobs skill to cast as well (or instead of effect). Cast by the entity of `at`;
#              at a fixed place (death victim, teleport from, block) by the attacker/killer or player.
#              @trigger is the other side of the event: the attacker for the victim and the other way round.
# at:          where the effect plays (the first value is the default)
#                hit:      victim | attacker
#                death:    victim | killer      (victim = the spot where it died)
#                join:     player
#                teleport: to | from
#                item_use: player | block       (block = on top of the clicked block)
#              If the effect has a `follow:` block and `at` is an entity, it follows that entity.
# permission:  true (= vengine.trigger.<id>) or any permission node; leave out to let everyone trigger it.
#              Checked on the attacker/killer when it is a player, otherwise on the victim/player.
# cooldown:    ticks before the same trigger may fire again for the same attacker/player
# chance:      0..1 probability to fire
# delay:       ticks to wait before playing (useful for join)
# filter:      all optional, a single value or a list
#                entity:   victim types (hit, death), e.g. [ZOMBIE, PLAYER]
#                attacker: attacker/killer types (hit, death); arrows count as their shooter
#                cause:    damage cause (hit, death) or teleport cause, e.g. ENDER_PEARL
#                item:     item in hand (item_use), e.g. BLAZE_ROD
#                mythic:          MythicMobs mob type of the victim/player, e.g. [SkeletonKing]
#                mythic_attacker: MythicMobs mob type of the attacker/killer (hit, death)
# options:     numbers or formulas over the event variables
#                scale, duration, parameters.<name>
#              variables: random (0..1) for every event, plus
#                hit:      damage, health, max_health   (victim health before the hit)
#                death:    max_health
#                teleport: distance                     (0 across worlds)
#              PlaceholderAPI placeholders work too and are read for the same player as `permission`,
#              e.g. scale: "0.5 + %player_level% / 50" (non-numeric values count as 0)

