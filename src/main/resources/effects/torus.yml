# Parametric torus expressed as a formula
# x = (R + r cos(phi)) cos(theta), y = r sin(phi), z = (R + r cos(phi)) sin(theta)
id: torus
surface:
  variables: [theta, phi]
  samples: [48, 18]
  angularSpeed: 0.05
  range:
    - { min: 0, max: 6.283185307179586 }
    - { min: 0, max: 6.283185307179586 }
  x: "(majorRadius + minorRadius * cos(phi)) * cos(theta)"
  y: "minorRadius * sin(phi)"
  z: "(majorRadius + minorRadius * cos(phi)) * sin(theta)"
  parameters:
    majorRadius: 1.4
    minorRadius: 0.45
particle: DUST
color:
  r: 120
  g: 210
  b: 255
scale: 1.0
duration: 80
