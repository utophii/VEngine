id: rossler
ode:
  method: euler
  step: dt
  samples: max(10, steps)
  parameters:
    a: 0.1
    b: 0.2
    c: 5.7
    dt: 0.02
    steps: 220
    angularSpeed: 0.03
  initial:
    x: 0.1
    y: 0
    z: 0
  derivatives:
    x: -(y + z)
    y: x + a*y
    z: b + z * (x - c)
  output:
    x: x * 0.12
    y: (z - 12) * 0.12
    z: y * 0.12
    yaw: time * angularSpeed
