id: halvorsen
ode:
  method: euler
  step: dt
  samples: max(10, steps)
  parameters:
    a: 1.1
    dt: 0.01
    steps: 220
    angularSpeed: 0.03
  initial:
    x: 1
    y: 1
    z: 1
  derivatives:
    x: -a*x - y - z + a*z
    y: x - a*y + z
    z: x + a * (y - x)
  output:
    x: x * 0.12
    y: y * 0.12
    z: z * 0.12
    yaw: time * angularSpeed
