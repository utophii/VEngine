# each point begins growing at time = t * 40 and fades over the next 40 ticks
id: age_wave
duration: 81
particle: DUST
dustSize: 1.2
gradientInterpolation: hsv
colorOverLife: ["#ffbb22", "#ff3366", "#5522cc"]
sizeOverLife: [0, 1, 0]
curve:
  variables: [t]
  samples: 96
  angularSpeed: 0
  range: [{min: 0, max: 1}]
  x: '2 * cos(t * tau)'
  y: '0'
  z: '2 * sin(t * tau)'
  age: '(time - t * 40) / 40'
