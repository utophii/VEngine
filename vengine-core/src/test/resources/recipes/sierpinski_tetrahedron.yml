id: sierpinski_tetrahedron
iteration:
  samples: points
  iterations: min(16, depth)
  selection: stratified
  reverse: true
  parameters:
    points: 600
    depth: 6
    radius: 1.5
    pulse: 0
    pulseSpeed: 0.08
    angularSpeed: 0.02
    ratio: 0.5
  initial:
    x: 0
    y: 0
    z: 0
  branches:
  - x: ratio * x + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (0)
    y: ratio * y + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (1)
    z: ratio * z + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (0)
  - x: ratio * x + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (0.9428090415820635)
    y: ratio * y + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (-0.3333333333333333)
    z: ratio * z + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (0.0)
  - x: ratio * x + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (-0.4714045207910315)
    y: ratio * y + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (-0.3333333333333333)
    z: ratio * z + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (0.8164965809277261)
  - x: ratio * x + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (-0.4714045207910322)
    y: ratio * y + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (-0.3333333333333333)
    z: ratio * z + (1 - ratio) * (1 + pulse * sin(time * pulseSpeed)) * (-0.8164965809277258)
  output:
    x: x * radius
    y: y * radius
    z: z * radius
    value: address
    yaw: time * angularSpeed
