id: golden_surface
surface:
  variables: [u, v]
  samples: [4, 4]
  range: [{min: 0, max: 1}, {min: -1, max: 1}]
  angularSpeed: 0.02
  parameters: {radius: 1, bias: 0.25, life: 8}
  x: radius * cos(u * tau)
  y: v + bias
  z: radius * sin(u * tau)
  value: (v + 1) / 2
  age: (time - u * 4 + v) / life
