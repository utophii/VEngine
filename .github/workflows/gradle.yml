name: Kotlin CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        gradle-version: '9.2.1'

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    # builds all modules, runs unit tests and produces the shadow jar
    - name: Build all modules
      run: ./gradlew build --no-daemon

    # multi-module layout: the distributable shadow jar lives in vengine-plugin,
    # the developer artifacts in vengine-api and vengine-core
    - name: Upload module jars
      uses: actions/upload-artifact@v4
      with:
        name: VEngine
        path: |
          vengine-plugin/build/libs/*.jar
          vengine-api/build/libs/*.jar
          vengine-core/build/libs/*.jar
        if-no-files-found: error